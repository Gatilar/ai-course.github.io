<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Леся, тебе письмо 💌">
<meta property="og:description" content="Котик-почтальон принёс кое-что важное">
<meta property="og:image" content="https://gatilar.github.io/ai-course.github.io/lesya/cat.jpg">
<meta name="theme-color" content="#ffd3e1">
<link rel="apple-touch-icon" href="cat.jpg">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Пойдём на свидание?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: одна открытка по центру, сверху рыжий мейн-кун-талисман; шаги сменяют друг друга внутри. Один пастельный мир для обеих тем. */
  :root {
    --bg: #ffe6ee;
    --bg-2: #ffd3e1;
    --card: #fffafc;
    --ink: #5b2337;
    --ink-soft: #9a5a70;
    --rose: #ff5c8a;
    --rose-deep: #e33c6f;
    --blush: #ffb8cb;
    --paper: #fff1f5;
    --leaf: #fffef7;
    --leaf-line: #cfe2f3;
    --leaf-margin: #ffaaaa;
    --tape: rgba(255, 184, 203, .75);
    --fur: #f5b36b;
    --fur-dark: #db8236;
    --fur-light: #fff3e4;
    --fur-line: #d48743;
    --eye: #d99a2b;
    --diploma: #fffaf0;
    --gold: #e0b44c;
    --gold-deep: #b8862a;
    --display: "Caveat", "Comic Sans MS", cursive;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: radial-gradient(circle at 25% 15%, var(--bg-2), var(--bg) 65%) fixed;
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    overflow-x: hidden;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .float { position: absolute; bottom: -40px; color: var(--blush); animation: rise linear forwards; }
  @keyframes rise { to { transform: translateY(calc(-100vh - 80px)) rotate(var(--rot)); opacity: 0; } }
  .spark, .paw { position: fixed; z-index: 8; pointer-events: none; transform: translate(-50%, -50%); }
  .spark { animation: fly .9s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }
  .paw { font-size: 20px; opacity: .7; animation: pawfade 1.2s ease-out forwards; }
  @keyframes pawfade { 0% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(.4); } 25% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); } 100% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); opacity: 0; } }

  .card {
    position: relative; z-index: 1;
    width: min(100%, 380px);
    background: var(--card);
    border-radius: 32px;
    padding: 20px 22px 24px;
    box-sizing: border-box;
    box-shadow: 0 20px 50px -20px rgba(227, 60, 111, .5);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--blush); opacity: .5; transition: all .3s; }
  .dots i.on { background: var(--rose); opacity: 1; width: 20px; border-radius: 6px; }

  /* Котик-талисман */
  .cat-wrap { position: relative; cursor: pointer; }
  .cat { display: block; width: 150px; height: 133px; transform-origin: 50% 90%; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
  .cat [data-m] { display: none; }
  .cat[data-mood="normal"] [data-m~="normal"],
  .cat[data-mood="happy"] [data-m~="happy"],
  .cat[data-mood="love"] [data-m~="love"],
  .cat[data-mood="sad"] [data-m~="sad"],
  .cat[data-mood="wink"] [data-m~="wink"],
  .cat[data-mood="surprised"] [data-m~="surprised"] { display: inline; }
  .cat[data-mood="surprised"] { animation: jolt .4s ease; }
  @keyframes jolt { 40% { transform: translateY(-10px) scale(1.06); } }
  .blep-t, .wave-paw { display: none; }
  .cat.blep[data-mood="normal"] .blep-t { display: inline; }
  .cat.waving .wave-paw { display: inline; }
  .wave-paw { transform-box: view-box; transform-origin: 40px 148px; animation: pawwave .45s ease-in-out infinite alternate; }
  @keyframes pawwave { from { transform: rotate(-18deg); } to { transform: rotate(14deg); } }
  .pupils { transition: transform .25s ease-out; }

  /* Котик, который гуляет по низу экрана */
  .walker { position: fixed; z-index: 0; left: 0; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 68px; cursor: pointer; }
  .walker .flip { width: 100%; height: 100%; }
  .walker.left .flip { transform: scaleX(-1); }
  .walker svg { width: 100%; height: 100%; display: block; animation: wbob .36s ease-in-out infinite alternate; overflow: visible; }
  @keyframes wbob { to { transform: translateY(-2px); } }
  .walker .leg { transform-box: fill-box; transform-origin: 50% 0; animation: step .36s ease-in-out infinite alternate; }
  .walker .leg.b { animation-delay: -.36s; }
  @keyframes step { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
  .walker .w-tail { transform-box: view-box; transform-origin: 20px 34px; animation: wag .5s ease-in-out infinite alternate; }
  .walker .w-eye { transform-box: fill-box; transform-origin: center; animation: blink 3s infinite; }
  .walker.paused svg, .walker.paused .leg { animation-play-state: paused; }
  .cat[data-mood="sad"] { animation: shake .5s ease-in-out; }
  .cat.squish { animation: squish .5s ease; }
  @keyframes shake { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  @keyframes squish { 30% { transform: scale(1.12, .88); } 60% { transform: scale(.94, 1.08); } }
  .tail { transform-box: view-box; transform-origin: 128px 134px; animation: wag 1.1s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
  .ear-l { transform-box: view-box; transform-origin: 62px 56px; animation: twitch 5.5s infinite; }
  .ear-r { transform-box: view-box; transform-origin: 118px 56px; animation: twitch 7s 2s infinite; }
  @keyframes twitch { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(-10deg); } 92% { transform: rotate(5deg); } 95% { transform: rotate(-3deg); } }
  .bubble {
    position: absolute; left: 50%; top: -18px; translate: -50% 0; z-index: 2;
    background: var(--card); color: var(--rose-deep);
    font: 700 1.35rem var(--display); white-space: nowrap;
    padding: 4px 12px; border-radius: 16px 16px 16px 4px;
    box-shadow: 0 6px 14px -6px rgba(227, 60, 111, .55);
    animation: bubble .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  @keyframes bubble { from { transform: scale(0) translateY(10px); opacity: 0; } }

  .step { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; animation: pop .45s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.1rem, 8.5vw, 2.6rem); line-height: 1.05;
    margin: 0; color: var(--rose-deep); text-wrap: balance;
  }
  p { margin: 0; color: var(--ink-soft); font-size: 1.02rem; line-height: 1.45; text-wrap: balance; }

  .row { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 56px; }
  button {
    font: 800 1.08rem var(--body);
    border: 0; border-radius: 999px; cursor: pointer;
    padding: 14px 26px;
    transition: transform .2s ease, background .2s;
  }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .main { background: var(--rose); color: #fff; animation: pulse 1.8s ease-out infinite; }
  .main:hover { background: var(--rose-deep); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 92, 138, .55); } 100% { box-shadow: 0 0 0 16px rgba(255, 92, 138, 0); } }
  .soft { background: var(--paper); color: var(--ink); border: 2px solid var(--blush); }

  /* Полароиды с настоящим котиком */
  .polaroid {
    position: relative; margin: 8px 0 0; width: 78%;
    background: #fff; padding: 10px 10px 6px; border-radius: 4px;
    box-shadow: 0 10px 24px -10px rgba(91, 35, 55, .5);
    transform-origin: 50% -6px; animation: swing 3s ease-in-out infinite;
  }
  .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; animation: kenburns 9s ease-in-out infinite alternate; }
  .polaroid .imgbox { overflow: hidden; border-radius: 2px; }
  .polaroid.wide img { aspect-ratio: 520 / 300; }
  .polaroid figcaption { font: 700 1.45rem var(--display); color: var(--ink); padding-top: 4px; }
  .ptape { position: absolute; top: -10px; left: 50%; width: 70px; height: 22px; background: var(--tape); transform: translateX(-50%) rotate(3deg); z-index: 1; }
  .polaroid.petted { animation: petted .5s ease; }
  @keyframes swing { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12) translate(-2%, 2%); } }
  @keyframes petted { 30% { transform: scale(1.06) rotate(-4deg); } 60% { transform: scale(.97) rotate(3deg); } }
  .zzz { position: absolute; right: 14%; top: 12%; pointer-events: none; }
  .zzz span { position: absolute; font: 700 1.6rem var(--display); color: #fff; text-shadow: 0 1px 4px rgba(91, 35, 55, .6); opacity: 0; animation: zz 3s ease-out infinite; }
  .zzz span:nth-child(2) { animation-delay: 1s; font-size: 2rem; }
  .zzz span:nth-child(3) { animation-delay: 2s; font-size: 2.4rem; }
  @keyframes zz { 0% { transform: translate(0, 10px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(26px, -50px) rotate(15deg); opacity: 0; } }

  .judge {
    position: fixed; z-index: 4; width: 132px; margin: 0;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: rotate(-6deg);
    animation: slidein .6s cubic-bezier(.3, 1.5, .5, 1) both;
  }
  .judge figcaption { font-size: 1.15rem; line-height: 1.1; }
  .judge img { animation: none; }
  .judge.nod { animation: nod .5s ease; }
  @keyframes slidein { from { transform: translateY(160%) rotate(-20deg); } to { transform: rotate(-6deg); } }
  @keyframes nod { 0% { transform: rotate(-6deg); } 30% { transform: rotate(-12deg) scale(1.08); } 60% { transform: rotate(2deg); } 100% { transform: rotate(-6deg); } }

  /* Больше движения */
  #blobs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #blobs i { position: absolute; border-radius: 50%; filter: blur(30px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  #blobs i:nth-child(1) { width: 260px; height: 260px; left: -60px; top: 8%; background: var(--blush); }
  #blobs i:nth-child(2) { width: 220px; height: 220px; right: -50px; top: 45%; background: #ffd7b0; animation-duration: 22s; animation-delay: -6s; }
  #blobs i:nth-child(3) { width: 200px; height: 200px; left: 30%; bottom: -60px; background: #f9c6e8; animation-duration: 26s; animation-delay: -12s; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, -40px) scale(1.15); } 100% { transform: translate(-30px, 50px) scale(.9); } }
  .card { animation: cardfloat 6s ease-in-out infinite; }
  @keyframes cardfloat { 0%, 100% { transform: translateY(0) rotate(-.4deg); } 50% { transform: translateY(-6px) rotate(.4deg); } }
  .step.out { animation: stepout .26s ease-in forwards; }
  @keyframes stepout { to { transform: translateY(-14px) scale(.92); opacity: 0; } }
  h1 .word { display: inline-block; white-space: nowrap; }
  h1 .ch { display: inline-block; animation: letterin .5s cubic-bezier(.3, 1.7, .5, 1) backwards, wave 3.2s ease-in-out infinite; animation-delay: var(--d), calc(var(--d) + .8s); }
  @keyframes letterin { from { transform: translateY(18px) scale(.4); opacity: 0; } }
  @keyframes wave { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-5px) rotate(-3deg); } 90% { transform: translateY(1px); } }
  .step > p, .step > .row, .step > .meter { animation: risein .5s ease-out backwards; }
  .step > p { animation-delay: .25s; }
  .step > .row, .step > .meter { animation-delay: .4s; }
  @keyframes risein { from { transform: translateY(14px); opacity: 0; } }
  .soft { animation: nudge 3.4s ease-in-out infinite; }
  .row .soft:nth-child(2) { animation-delay: .5s; }
  @keyframes nudge { 0%, 82%, 100% { transform: rotate(0); } 86% { transform: rotate(-4deg) scale(1.04); } 90% { transform: rotate(4deg) scale(1.04); } 94% { transform: rotate(-2deg); } }
  .chip .e { animation: bob2 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob2 { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(6deg); } }
  .dots i.on { animation: dotpulse 1.2s ease-in-out infinite; }
  @keyframes dotpulse { 50% { transform: scaleX(1.2); background: var(--rose-deep); } }
  .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  .shine::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .75), transparent);
    animation: sweep 3.8s ease-in-out infinite;
  }
  @keyframes sweep { 0% { left: -60%; } 45%, 100% { left: 130%; } }
  .trail { position: fixed; z-index: 7; pointer-events: none; transform: translate(-50%, -50%); animation: trail .9s ease-out forwards; }
  @keyframes trail { to { transform: translate(-50%, 10px) scale(.3); opacity: 0; } }
  .tassel { transform-box: view-box; transform-origin: 90px 35px; animation: tassel 1.6s ease-in-out infinite alternate; }
  @keyframes tassel { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  .sheet-bg {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(91, 35, 55, .35);
    display: grid; place-items: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    animation: fadein .25s ease;
  }
  @keyframes fadein { from { opacity: 0; } }
  .sheet {
    width: min(100%, 380px); max-height: 100%; overflow-y: auto; box-sizing: border-box;
    background: var(--card); border-radius: 28px; padding: 22px 20px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    animation: pop .45s cubic-bezier(.3, 1.5, .5, 1);
  }
  .sheet h2 { margin: 0; font: 700 2.1rem var(--display); color: var(--rose-deep); }
  .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 20px; padding: 16px 8px; color: #fff; }
  .app span { font-size: 1.8rem; }
  .app.tg { background: #2aabee; }
  .app.ig { background: linear-gradient(45deg, #f9b234, #ee2a7b 55%, #6228d7); }
  .preview { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .preview img { width: 100%; border-radius: 14px; box-shadow: 0 8px 20px -10px rgba(91, 35, 55, .5); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
  .preview .how { font-size: .95rem; color: var(--ink); }
  a.main { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 999px; font: 800 1.08rem var(--body); text-decoration: none; }

  .chips.three { grid-template-columns: repeat(3, 1fr); }
  .chips.three .chip { padding: 10px 4px; font-variant-numeric: tabular-nums; }
  .custom { display: flex; gap: 10px; align-items: center; justify-content: center; animation: pop .4s cubic-bezier(.3, 1.5, .5, 1); }
  .custom input { font: 800 1.3rem var(--body); padding: 10px 12px; border-radius: 14px; border: 2px solid var(--blush); background: var(--paper); color: var(--ink); }

  #cap { transform-box: view-box; transform-origin: 90px 36px; animation: capdrop .7s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes capdrop { from { transform: translateY(-60px) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Диплом умнички */
  .diploma {
    position: relative; width: 100%; box-sizing: border-box;
    background: var(--diploma); color: var(--ink);
    border: 3px double var(--gold); outline: 6px solid var(--diploma); outline-offset: -12px;
    border-radius: 10px; padding: 22px 18px 20px;
    box-shadow: 0 10px 24px -10px rgba(91, 35, 55, .45);
    animation: unroll .8s cubic-bezier(.3, 1.3, .5, 1);
  }
  @keyframes unroll { from { transform: scaleY(.1) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .diploma .d-title { font: 800 1.05rem var(--body); letter-spacing: .3em; color: var(--gold-deep); }
  .diploma .d-name { font: 700 2rem/1.1 var(--display); color: var(--rose-deep); margin: 6px 0; }
  .diploma .d-text { font-size: .92rem; color: var(--ink-soft); }
  .diploma .d-sign { display: flex; justify-content: space-between; align-items: end; margin-top: 14px; font: 600 1.2rem var(--display); color: var(--ink-soft); text-align: left; }
  .stamp {
    position: absolute; right: 12px; bottom: 34px;
    width: 78px; height: 78px; border-radius: 50%;
    border: 3px solid var(--rose); color: var(--rose);
    display: grid; place-items: center; text-align: center;
    font: 800 .7rem/1.1 var(--body); letter-spacing: .06em;
    background: rgba(255, 92, 138, .06);
    transform: rotate(-14deg);
    animation: stamp .5s .9s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  .stamp b { display: block; font-size: 1.05rem; }
  @keyframes stamp { from { transform: scale(3) rotate(-30deg); opacity: 0; } to { transform: rotate(-14deg); opacity: 1; } }
  .toss { font-size: 3rem; line-height: 1; animation: toss 1.6s ease-in-out infinite; }
  @keyframes toss { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-26px) rotate(-200deg); } 70% { transform: translateY(0) rotate(-360deg); } }
  .leaf .sub { font: 600 1.4rem/32px var(--display); color: var(--ink-soft); }

  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .chip { font: 700 .98rem var(--body); padding: 13px 10px; border-radius: 18px; background: var(--paper); color: var(--ink); border: 2px solid var(--blush); animation: pop .45s cubic-bezier(.3, 1.5, .5, 1) backwards; }
  .chip .e { display: block; font-size: 1.6rem; margin-bottom: 2px; transition: transform .3s; }
  .chip:hover { border-color: var(--rose); }
  .chip:hover .e { transform: scale(1.2) rotate(-8deg); }
  .chip.sel { background: var(--rose); color: #fff; border-color: var(--rose); }
  .chip.sel .e { animation: jump .45s ease; }
  @keyframes jump { 40% { transform: translateY(-10px) scale(1.3); } }

  .env { background: none; padding: 0; border-radius: 0; animation: wiggle 1.8s ease-in-out infinite; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-6deg); } 86% { transform: rotate(6deg); } 94% { transform: rotate(-3deg); } }
  .env svg { width: 210px; height: 160px; display: block; }
  #flap { transform-origin: 50% 0; transition: transform .5s ease; }
  .env.open { animation: none; }
  .env.open #flap { transform: scaleY(-1); }
  .env.open #letter { transform: translateY(-40px); }
  #letter { transition: transform .5s .3s ease; }

  /* Листочек из тетради с вопросом */
  .leaf {
    position: relative; width: 100%; box-sizing: border-box;
    background-color: var(--leaf);
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--leaf-line) 31px 32px);
    background-position: 0 18px;
    border-radius: 6px;
    padding: 30px 16px 16px 44px;
    box-shadow: 0 8px 20px -10px rgba(91, 35, 55, .45);
    transform: rotate(-1.5deg);
    text-align: left;
    animation: leafin .7s cubic-bezier(.3, 1.4, .5, 1);
  }
  @keyframes leafin { from { transform: translateY(40px) rotate(8deg); opacity: 0; } to { transform: rotate(-1.5deg); opacity: 1; } }
  .leaf::before { content: ""; position: absolute; left: 32px; top: 0; bottom: 0; width: 2px; background: var(--leaf-margin); }
  .leaf::after {
    content: ""; position: absolute; left: 10px; top: 40px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--card); box-shadow: 0 90px 0 var(--card);
  }
  .tape { position: absolute; top: -12px; left: 50%; width: 96px; height: 26px; background: var(--tape); transform: translateX(-50%) rotate(-4deg); }
  .q { font: 700 2.1rem/32px var(--display); color: var(--ink); text-wrap: balance; }
  .opts { display: flex; gap: 22px; align-items: center; min-height: 64px; margin-top: 6px; }
  .opt {
    background: none; padding: 4px 6px; border-radius: 10px;
    font: 700 1.9rem var(--display); color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .box { position: relative; flex: none; width: 26px; height: 26px; border: 2.5px solid var(--ink); border-radius: 5px; }
  .opt.checked .box::after { content: "✓"; position: absolute; left: 1px; top: -18px; font: 700 2.4rem var(--display); color: var(--rose-deep); animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
  .sig { font: 600 1.35rem var(--display); color: var(--ink-soft); text-align: right; margin-top: 4px; }
  #yes { transform: scale(var(--grow, 1)); transform-origin: left center; }
  #no { transform: scale(var(--s, 1)); }
  #no.runaway {
    position: fixed; z-index: 5; background: var(--leaf);
    box-shadow: 0 6px 16px -6px rgba(91, 35, 55, .45);
    transition: left .3s ease, top .3s ease, transform .3s ease;
  }
  .react {
    position: fixed; z-index: 6; pointer-events: none;
    display: flex; align-items: center; gap: 6px;
    font: 800 .95rem var(--body); color: var(--ink);
    background: var(--card); padding: 8px 12px; border-radius: 14px;
    box-shadow: 0 8px 20px -8px rgba(227, 60, 111, .55);
    white-space: nowrap; animation: react 1.7s ease-out forwards;
  }
  .react b { font-size: 1.6rem; line-height: 1; }
  @keyframes react {
    0% { transform: translate(-50%, 0) scale(.5); opacity: 0; }
    15% { transform: translate(-50%, -12px) scale(1.08); opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }

  .meter { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .meter .big { font-size: 3rem; line-height: 1; transition: transform .2s; }
  .meter .lbl { font-family: var(--display); font-size: 1.6rem; color: var(--rose-deep); min-height: 1.6em; }
  input[type="range"] { width: 100%; accent-color: var(--rose); height: 28px; }

  .ticket {
    position: relative; width: 100%; box-sizing: border-box;
    background: var(--paper); border: 2px dashed var(--rose);
    border-radius: 20px; padding: 16px 18px 14px; text-align: left;
    animation: pop .6s .2s cubic-bezier(.3, 1.5, .5, 1) backwards;
  }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px;
    background: var(--card); border-radius: 50%; border: 2px dashed var(--rose);
  }
  .ticket::before { left: -13px; clip-path: inset(0 0 0 50%); }
  .ticket::after { right: -13px; clip-path: inset(0 50% 0 0); }
  .t-head { font: 800 .78rem var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--rose-deep); text-align: center; margin-bottom: 10px; }
  .ticket dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  .ticket dt { color: var(--ink-soft); font-size: .9rem; }
  .ticket dd { margin: 0; font-weight: 800; color: var(--ink); }
  .t-foot { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--blush); font-size: .78rem; color: var(--ink-soft); text-align: center; }
  .note { font-family: var(--display); font-size: 1.6rem; color: var(--rose); }
  .small { font-size: .85rem; }
  .link-btn { background: none; color: var(--ink-soft); font-weight: 700; font-size: .9rem; padding: 6px 10px; text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .float, .spark, .paw { display: none; }
  }
</style>
</head>

    h.style.fontSize = size + 'px';

    h.style.setProperty('--rot', (Math.random() * 120 - 60) + 'deg');

    if (ch === '🐾') h.style.opacity = '.45';
    sky.appendChild(h);
    setTimeout(() => h.remove(), dur * 1000);
  }

  function burst() {
    for (let i = 0; i < 40; i++) setTimeout(() => floater(Math.random() * innerWidth, 18 + Math.random() * 26, 3 + Math.random() * 3, ROSES[i % 4], i % 7 === 0 ? '🐾' : '♥'), i * 40);
  }
  // Взрыв искорок из точки
  function sparkle(x, y, n = 14, chars = ['♥', '♥', '✨', '🐾']) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = pick(chars);
      const a = (Math.PI * 2 * i) / n + Math.random() * .5, d = 60 + Math.random() * 70;
      s.style.left = x + 'px';

  const clamp = (v, a) => Math.max(-a, Math.min(a, v));

  setInterval(() => {

    const m = cat.getAttribute('data-mood');
    if (m !== 'normal' && m !== 'happy') return;
    const act = pick(['look', 'look', 'wink', 'blep', 'tilt', 'wave', 'purr']);

  // Рисуем билет картинкой для отправки
  const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  function rr(x, l, t, w, h, r) {
    x.beginPath();
    x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
    x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
  }
  async function makeTicketImage() {
    try { await document.fonts.ready; } catch (e) {}
    const W = 1080, H = 1560, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, v('--bg-2')); g.addColorStop(1, v('--bg'));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let i = 0; i < 26; i++) {
      x.globalAlpha = .3 + Math.random() * .3; x.fillStyle = pick(ROSES);
      x.font = `${30 + Math.random() * 50}px sans-serif`;
      x.fillText('♥', Math.random() * W, Math.random() * H);
    }
    x.globalAlpha = 1;
    rr(x, 60, 60, W - 120, H - 120, 56);
    x.shadowColor = 'rgba(227, 60, 111, .35)'; x.shadowBlur = 40; x.shadowOffsetY = 16;
    x.fillStyle = v('--card'); x.fill();
    x.shadowColor = 'transparent';
    x.fillStyle = v('--rose-deep'); x.font = '700 120px Caveat, cursive';
    x.fillText('Договорились!', W / 2, 180);

    // Полароид со спящим котиком
    const img = await loadImg(IMG.sleep), pw = 720, ph = pw * 300 / 520, fh = ph + 130;
    x.save(); x.translate(W / 2, 270 + fh / 2); x.rotate(-0.03);
    x.shadowColor = 'rgba(91, 35, 55, .35)'; x.shadowBlur = 30; x.shadowOffsetY = 12;
    x.fillStyle = '#fff'; x.fillRect(-pw / 2 - 20, -fh / 2, pw + 40, fh);
    x.shadowColor = 'transparent';
    x.drawImage(img, -pw / 2, -fh / 2 + 20, pw, ph);
    x.fillStyle = v('--ink'); x.font = '700 46px Caveat, cursive';
    x.fillText('Котик уже спит и видит наше свидание', 0, fh / 2 - 52);
    x.rotate(0.06); x.fillStyle = v('--tape'); x.fillRect(-70, -fh / 2 - 18, 140, 38);
    x.restore();

    // Сам билет
    const tx = 130, ty = 870, tw = W - 260, th = 540;
    rr(x, tx, ty, tw, th, 40);
    x.fillStyle = v('--paper'); x.fill();
    x.setLineDash([16, 12]); x.lineWidth = 4; x.strokeStyle = v('--rose'); x.stroke();
    x.fillStyle = v('--rose-deep'); x.font = '800 34px Nunito, sans-serif';
    if ('letterSpacing' in x) x.letterSpacing = '5px';
    x.fillText('♥ БИЛЕТ НА СВИДАНИЕ ♥', W / 2, ty + 62);
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    const rows = [['Для', 'Леси 💕'], ['Повод', 'Дипломка сдана 🎓'], ['Куда', state.place], ['Время', state.time], ['Жду', `на ${state.level}%`], ['Котик', 'одобряет 🐾']];
    x.textAlign = 'left';
    rows.forEach(([a, b], i) => {
      const y = ty + 135 + i * 60;
      x.fillStyle = v('--ink-soft'); x.font = '500 36px Nunito, sans-serif'; x.fillText(a, tx + 60, y);
      x.fillStyle = v('--ink'); x.font = '800 40px Nunito, sans-serif'; x.fillText(b, tx + 240, y);
    });
    x.strokeStyle = v('--blush'); x.lineWidth = 2;
    x.beginPath(); x.moveTo(tx + 40, ty + 470); x.lineTo(tx + tw - 40, ty + 470); x.stroke();
    x.setLineDash([]);
    x.textAlign = 'center'; x.fillStyle = v('--ink-soft'); x.font = '500 26px Nunito, sans-serif';
    x.fillText('Действует для двоих · Обмену и возврату не подлежит', W / 2, ty + 505);
    x.fillStyle = v('--rose'); x.font = '700 64px Caveat, cursive';
    x.fillText('Лесенька, уже считаю минуты ♥', W / 2, ty + th + 45);
    const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
    return { blob, url: c.toDataURL('image/png') };
  }

        <div class="custom" id="custom" hidden>
          <input type="time" id="tm" value="19:30" aria-label="Своё время">
          <button class="main" id="tmok" type="button">Готово</button>
        </div>`;
      const box = el.querySelector('.chips'), custom = el.querySelector('#custom');
      const choose = (b, value) => {
        box.querySelectorAll('.chip').forEach((c) => c.classList.remove('sel'));
        b.classList.add('sel');
        state.time = value;
        mood('love');
        say(pick(['Записал ⏰', 'Идеально!', 'Мяу, договорились!']));
        sparkle(...center(b), 12, ['⏰', '♥', '✨']);
        setTimeout(() => show('level'), 650);
      };
      [...Object.keys(clocks).map((h) => [clocks[h], h + ':00']), ['⏰', 'Своё время']].forEach(([e, label], idx) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.style.animationDelay = (idx * 60) + 'ms';
        b.style.setProperty('--d', (idx * 250) + 'ms');
        b.innerHTML = `<span class="e">${e}</span>${label}`;
        b.onclick = () => {
          if (label !== 'Своё время') return choose(b, label);
          box.querySelectorAll('.chip').forEach((c) => c.classList.remove('sel'));
          b.classList.add('sel');
          custom.hidden = false;
          say('Какое время?');
        };
        box.appendChild(b);
      });
      el.querySelector('#tmok').onclick = (e) => {
        const v = el.querySelector('#tm').value;
        if (v) choose(e.currentTarget, v);
      };
    },

    level(el) {
      mood('happy');
      el.innerHTML = `<h1>Насколько ждёшь?</h1><p>Подвинь ползунок</p>
        <div class="meter"><div class="big" id="big"></div><div class="lbl" id="lbl"></div>
        <input type="range" id="lvl" min="0" max="100" value="${state.level}" aria-label="Насколько ждёшь свидание"></div>
        <div class="row"><button class="main" type="button">Дальше</button></div>`;
      const r = el.querySelector('#lvl'), big = el.querySelector('#big'), lbl = el.querySelector('#lbl');
      const upd = () => {
        const v = +r.value; state.level = v;
        const [e, t, m] = v < 20 ? ['🥺', 'Ну хоть чуть-чуть?', 'sad']
          : v < 50 ? ['🙂', 'Уже неплохо', 'normal']
          : v < 80 ? ['😊', 'Жду!', 'happy']
          : v < 100 ? ['😍', 'Очень жду!', 'love']
          : ['🥰', 'Больше всего на свете!', 'love'];
        big.textContent = e; lbl.textContent = t; mood(m);
        big.style.transform = `scale(${0.8 + v / 250})`;
      };
      r.addEventListener('input', upd);
      r.addEventListener('change', () => { if (+r.value >= 90) { sparkle(...center(big), 16); say('Мур! Я тоже!'); } });
      upd();
      el.querySelector('.main').onclick = () => show('ticket');
    },

    ticket(el) {
      burst();
      el.innerHTML = `<h1>Договорились!</h1>
        ${polaroid(IMG.sleep, 'Котик уже спит и видит наше свидание', '<div class="zzz"><span>z</span><span>z</span><span>Z</span></div>', 'wide')}
        <div class="ticket">
          <span class="shine"></span>
          <div class="t-head">♥ Билет на свидание ♥</div>
          <dl>
            <dt>Для</dt><dd>Леси 💕</dd>
            <dt>Повод</dt><dd>Дипломка сдана 🎓</dd>
            <dt>Куда</dt><dd>${state.place}</dd>
            <dt>Время</dt><dd>${state.time}</dd>
            <dt>Жду</dt><dd>на ${state.level}%</dd>
            <dt>Котик</dt><dd>одобряет 🐾</dd>
          </dl>
          <div class="t-foot">Действует для двоих · Обмену и возврату не подлежит</div>
        </div>
        <p class="note">Лесенька, уже считаю минуты ♥</p>
        <div class="row"><button class="main" id="send" type="button">Отправить билет Мише 💌</button></div>
        <p class="small">Откроется меню «Поделиться»: выбери Telegram или Instagram и Мишу</p>
        <button class="link-btn" type="button">Начать сначала</button>`;
      el.querySelector('.link-btn').onclick = () => show('envelope');
      // Картинку билета готовим заранее, чтобы меню «Поделиться» открылось сразу по нажатию
      let png = null;
      const ticketPng = makeTicketImage().then((p) => (png = p));
      const send = el.querySelector('#send');
      send.onclick = () => {
        if (!png) return openSendSheet(ticketPng);
        const file = new File([png.blob], 'bilet-na-svidanie.png', { type: 'image/png' });
        if (!(navigator.canShare && navigator.canShare({ files: [file] }))) return openSendSheet(ticketPng);
        navigator.share({ files: [file], text: 'Мой билет на свидание 💌' })
          .then(() => {
            send.textContent = 'Отправлено! 💕';
            sparkle(...center(send), 20);
            say('Ура! Миша будет счастлив');
          })
          .catch((e) => { if (!e || e.name !== 'AbortError') openSendSheet(ticketPng); });
      };
    }
  };

  // Убегающая и уменьшающаяся кнопка «Нет»
  const reactions = [
    ['😏', 'У тебя нет выбора'], ['🙅', 'Неправильный ответ!'], ['🤭', 'Не поймаешь!'],
    ['🥺', 'Ну пожалуйста…'], ['😼', 'Котик против'], ['💔', 'Ай, сердечко'],
    ['🙈', 'Я этого не видел'], ['😤', 'Попробуй ещё раз… но «Да»'], ['🤡', 'Мимо!'],
    ['😎', 'Кнопка «Нет» на ремонте']
  ];
  const hints = ['Ой, кнопка убежала', 'Котик расстроился…', 'Кнопка «Нет» становится всё меньше', 'А «Да» всё больше', 'Может, всё-таки «Да»?'];
  const judgeLines = ['Котик осуждает 😾', 'Котик осуждает 😾', 'Котик осуждает 😾', 'Очень осуждает', 'Очень осуждает', 'Котик в шоке 🙀', 'Котик в шоке 🙀', 'Ну всё…', 'Ну всё…'];
  const MAX_TRIES = 10;
  let tries = 0;

  function reactAt(x, y, [e, t]) {
    const d = document.createElement('div');
    d.className = 'react';
    d.innerHTML = `<b>${e}</b>${t}`;
    d.style.left = Math.min(Math.max(x, 120), innerWidth - 120) + 'px';
    d.style.top = Math.min(Math.max(y - 30, 16), innerHeight - 70) + 'px';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1700);
  }

  function judge() {
    let j = $('#judge');
    if (!j) {
      document.body.insertAdjacentHTML('beforeend', polaroid(IMG.judge, '', '', 'judge').replace('<figure', '<figure id="judge"'));
      j = $('#judge');
    } else {
      j.classList.remove('nod');
      void j.offsetWidth;
      j.classList.add('nod');
    }
    j.querySelector('figcaption').textContent = judgeLines[Math.min(tries - 1, judgeLines.length - 1)];
  }

  function runAway(e) {
    if (e) e.preventDefault();
    if (no.hidden || Date.now() - (runAway.last || 0) < 300) return;
    runAway.last = Date.now();
    tries++;
    const r = no.getBoundingClientRect();
    reactAt(r.left + r.width / 2, r.top, reactions[(tries - 1) % reactions.length]);
    judge();
    const hint = $('#hint');
    const yes = $('#yes');
    if (yes) yes.style.setProperty('--grow', Math.min(1 + tries * 0.08, 1.6));
    mood('sad');
    clearTimeout(runAway.t);
    runAway.t = setTimeout(() => mood('normal'), 1200);

    if (tries >= MAX_TRIES) {
      no.hidden = true;
      document.body.appendChild(no);
      if (hint) hint.textContent = 'Кнопка «Нет» сбежала насовсем. Остался только один вариант 😌';
      $('#judge figcaption').textContent = 'Так-то лучше 😼';
      setTimeout(() => reactAt(innerWidth / 2, innerHeight / 2, ['🏃', 'Пока-пока, «Нет»!']), 400);
      return;
    }
    if (hint) hint.textContent = hints[Math.min(tries - 1, hints.length - 1)];
    no.style.setProperty('--s', Math.max(1 - tries * 0.08, 0.3));

    if (!no.classList.contains('runaway')) {
      document.body.appendChild(no);
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('runaway');
      no.getBoundingClientRect();
    }
    const pad = 16, maxX = innerWidth - r.width - pad, maxY = innerHeight - r.height - pad;
    const y = yes ? yes.getBoundingClientRect() : { left: 0, right: 0, top: 0, bottom: 0 };
    let x, top, n = 0;
    do {
      x = pad + Math.random() * Math.max(0, maxX - pad);
      top = pad + Math.random() * Math.max(0, maxY - pad);
      n++;
    } while (n < 30 && x < y.right + 10 && x + r.width > y.left - 10 && top < y.bottom + 10 && top + r.height > y.top - 10);
    no.style.left = x + 'px';
    no.style.top = top + 'px';
  }
  no.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') runAway(); });
  no.addEventListener('pointerdown', runAway);
  no.addEventListener('click', runAway);

  show('envelope');
</script>

</body>
</html>
